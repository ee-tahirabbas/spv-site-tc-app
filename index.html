<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Site T&C Data Capture — Smart PV Solar</title>
<meta name="theme-color" content="#155C2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPV Site T&C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --green:#1F7A3D; --green-dark:#124023; --green-mid:#1B6B37;
    --gold:#D6A419; --gold-dark:#9C7712;
    --teal:#0E8C86; --teal-bg:#E4F5F4;
    --bg:#F2F5F3; --card:#FFFFFF; --line:#E1E8E3; --line-soft:#EEF2EF;
    --text:#182420; --muted:#6B7A72; --muted2:#9AA6A0;
    --pass:#1F9254; --pass-bg:#E4F5EA;
    --fail:#C0392B; --fail-bg:#FCE8E5;
    --na:#8A8F98; --na-bg:#ECEEF0;
    --purple:#6C4EE3; --purple-bg:#EFE9FC; --purple-dark:#4E33B8;
    --pending-bg:#FFF7E0; --pending-line:#E9C766; --pending-text:#8a6d1a;
    --gold-bg:#FBF1DA;
    --radius:16px; --radius-sm:11px;
    --shadow:0 2px 10px rgba(20,40,30,0.06), 0 1px 2px rgba(20,40,30,0.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:contain;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  button{font-family:inherit; cursor:pointer;}
  svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}

  /* ===== HEADER ===== */
  header.topbar{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    box-shadow:0 3px 14px rgba(10,30,18,0.18);
  }
  .hdr-row{display:flex;align-items:center;gap:10px;}
  header.topbar img.logo{width:36px;height:36px;border-radius:9px;background:#fff;padding:2px;object-fit:contain;flex-shrink:0;}
  header.topbar button.back{
    background:rgba(255,255,255,0.16);border:none;color:#fff;font-size:16px;
    width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  header.topbar button.back svg{stroke:#fff;}
  .titles{flex:1;min-width:0;}
  .t1{font-size:15px;font-weight:700;line-height:1.2;letter-spacing:-.01em;}
  .t2{font-size:11px;opacity:.82;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sync-pill{
    display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:6px 10px;border-radius:20px;background:rgba(255,255,255,0.14);
    white-space:nowrap;flex-shrink:0;border:1px solid rgba(255,255,255,0.18);
  }
  .sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#9AA6A0;flex-shrink:0;}
  .sync-pill .dot.synced{background:#5CD98B; box-shadow:0 0 6px #5CD98B;}
  .sync-pill .dot.dirty{background:#F5C451; box-shadow:0 0 6px #F5C451;}
  .site-strip{
    margin-top:10px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);
    border-radius:11px;padding:8px 10px;
  }
  .site-strip svg{stroke:#EFE3B9;flex-shrink:0;}
  .site-strip .name{font-size:12.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .site-strip button{background:rgba(255,255,255,0.16);border:none;color:#fff;font-size:10.5px;font-weight:700;
    padding:5px 10px;border-radius:8px;}

  main{padding:14px;}

  /* ===== HOME ===== */
  .summary-strip{display:flex;gap:8px;margin-bottom:16px;}
  .summary-strip .chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
  .summary-strip .chip .num{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .summary-strip .chip .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:700;}
  .summary-strip .chip.pass .num{color:var(--pass);}
  .summary-strip .chip.fail .num{color:var(--fail);}
  .summary-strip .chip.pending .num{color:var(--pending-text);}

  .progress-track{height:7px;border-radius:20px;background:var(--line);overflow:hidden;display:flex;margin-bottom:20px;}
  .progress-track .seg{height:100%;}

  .section-title{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
    letter-spacing:.07em;margin:18px 3px 9px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--line);}

  .home-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow); transition:transform .1s;
  }
  .home-card:active{transform:scale(0.97);}
  .home-card .ic-wrap{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ic-wrap.tint-green{background:var(--pass-bg);color:var(--pass);}
  .ic-wrap.tint-teal{background:var(--teal-bg);color:var(--teal);}
  .ic-wrap.tint-gold{background:var(--gold-bg);color:var(--gold-dark);}
  .ic-wrap.tint-grey{background:var(--na-bg);color:var(--muted);}
  .ic-wrap.tint-purple{background:var(--purple-bg);color:var(--purple-dark);}
  .home-card .info{flex:1;min-width:0;}
  .home-card .info .name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.005em;}
  .home-card .info .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .home-card .badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;flex-shrink:0;
    background:var(--pending-bg);color:var(--pending-text);border:1px solid var(--pending-line);}
  .home-card .badge.done{background:var(--pass-bg);color:var(--pass);border-color:#bfe6cd;}
  .home-card .badge.zero{background:var(--na-bg);color:var(--muted2);border-color:#dfe2e6;}
  .home-card .badge.arrow{background:var(--green);color:#fff;border-color:var(--green);width:26px;height:26px;padding:0;
    border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .home-card .badge.arrow svg{width:14px;height:14px;stroke:#fff;}

  /* ===== CHECKLIST ITEM ===== */
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 13px;margin-bottom:9px;box-shadow:var(--shadow);}
  .item .label{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:11px;color:var(--text);}
  .item .sub{font-size:11px;color:var(--muted);margin-top:-7px;margin-bottom:11px;}
  .seg{display:flex;gap:7px;}
  .seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:var(--radius-sm);
    padding:10px 4px;font-size:12px;font-weight:700;color:var(--muted);transition:.12s;}
  .seg button:active{transform:scale(0.96);}
  .seg button.pass.on{background:var(--pass-bg);border-color:var(--pass);color:var(--pass);}
  .seg button.fail.on{background:var(--fail-bg);border-color:var(--fail);color:var(--fail);}
  .seg button.na.on{background:var(--na-bg);border-color:#8A8F98;color:var(--na);}
  .remarks-toggle{margin-top:9px;font-size:11.5px;color:var(--green);font-weight:700;background:none;border:none;padding:0;display:flex;align-items:center;gap:5px;}
  .remarks-box{margin-top:9px;}
  textarea, input[type=text], input[type=number]{
    width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;
    font-size:13.5px;font-family:inherit;background:#fcfdfc;color:var(--text);}
  textarea:focus, input:focus{outline:none;border-color:var(--green);background:#fff;}
  textarea{resize:vertical;min-height:52px;}

  /* ===== STRINGS ===== */
  .filter-row{display:flex;gap:7px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px;}
  .filter-row button{flex-shrink:0;border:1.5px solid var(--line);background:#fff;
    border-radius:20px;padding:8px 15px;font-size:12px;font-weight:700;color:var(--muted);}
  .filter-row button.on{background:var(--green);border-color:var(--green);color:#fff;}
  .str-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);}
  .str-head{display:flex;align-items:center;gap:10px;padding:12px 13px;}
  .str-head .dot{width:10px;height:10px;border-radius:50%;background:#D5DBD7;flex-shrink:0;}
  .str-head .dot.pass{background:var(--pass);}
  .str-head .dot.fail{background:var(--fail);}
  .str-head .id{font-size:13.5px;font-weight:700;flex:1;}
  .str-head .meta{font-size:11px;color:var(--muted);}
  .str-head svg{color:var(--muted2);flex-shrink:0;}
  .str-body{padding:2px 13px 13px;border-top:1px solid var(--line-soft);}
  .row2{display:flex;gap:9px;margin-top:11px;}
  .row2>div{flex:1;}
  .field-lbl{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}

  /* ===== ADD ROW / LISTS ===== */
  .add-row{display:flex;gap:8px;margin-bottom:13px;}
  .add-row input{flex:1;}
  .add-row button{background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:0 18px;font-weight:800;font-size:19px;}
  .del-btn{background:var(--fail-bg);color:var(--fail);border:none;border-radius:9px;
    font-size:11px;font-weight:700;padding:7px 11px;margin-top:9px;}

  .signoff-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .signoff-card .role{font-size:13.5px;font-weight:800;color:var(--green-mid);margin-bottom:11px;}
  .field-group{margin-bottom:10px;}
  .field-group label{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
  .note-box{background:var(--gold-bg);border:1px solid #E9C766;border-radius:13px;padding:12px 13px;font-size:12px;color:#6B5417;margin-bottom:15px;line-height:1.45;display:flex;gap:9px;}
  .note-box svg{flex-shrink:0;stroke:#9C7712;margin-top:1px;}

  /* ===== SETTINGS / SYNC ===== */
  .settings-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px;box-shadow:var(--shadow);}
  .settings-card h4{font-size:12.5px;font-weight:800;color:var(--text);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;}
  .site-list-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-soft);}
  .site-list-item:last-child{border-bottom:none;}
  .site-list-item .rb{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
  .site-list-item.active .rb{border-color:var(--green);background:var(--green);position:relative;}
  .site-list-item .sname{flex:1;font-size:13.5px;font-weight:600;}
  .site-list-item .site-del{background:var(--fail-bg);color:var(--fail);border:none;border-radius:8px;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .site-list-item .site-del svg{width:15px;height:15px;}
  .manager-site-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:9px;box-shadow:var(--shadow);}
  .manager-site-card .msc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .manager-site-card .msc-name{font-size:14.5px;font-weight:800;flex:1;}
  .manager-site-card .msc-time{font-size:10.5px;color:var(--muted2);}
  .msc-chips{display:flex;gap:6px;}
  .msc-chips .c{flex:1;text-align:center;border-radius:9px;padding:7px 4px;font-size:11px;font-weight:800;}
  .msc-chips .c.pass{background:var(--pass-bg);color:var(--pass);}
  .msc-chips .c.fail{background:var(--fail-bg);color:var(--fail);}
  .msc-chips .c.pending{background:var(--pending-bg);color:var(--pending-text);}
  .ro-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .ro-row:last-child{border-bottom:none;}
  .ro-row .lbl{font-size:12.5px;color:var(--text);flex:1;}
  .ro-chip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0;}
  .ro-chip.pass{background:var(--pass-bg);color:var(--pass);}
  .ro-chip.fail{background:var(--fail-bg);color:var(--fail);}
  .ro-chip.na, .ro-chip.pending{background:var(--na-bg);color:var(--na);}
  .admin-unlock{background:var(--purple-bg);border:1px solid #D8CDF7;border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .admin-unlock h4{font-size:13px;font-weight:800;color:var(--purple-dark);margin:0 0 8px;}
  .sync-log-row{display:flex;justify-content:space-between;font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--line-soft);color:var(--muted);}
  .sync-log-row:last-child{border-bottom:none;}
  .sync-log-row .st.ok{color:var(--pass);font-weight:700;}
  .sync-log-row .st.err{color:var(--fail);font-weight:700;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--green);color:#fff;border:none;border-radius:13px;
    padding:14px;font-size:14.5px;font-weight:700;margin-bottom:10px;box-shadow:0 3px 10px rgba(31,122,61,0.25);}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);box-shadow:none;}
  .btn.danger{background:#fff;color:var(--fail);border:1.5px solid var(--fail);box-shadow:none;}
  .btn svg{stroke:currentColor;}

  .export-box textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:#182420;color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;font-weight:600;
    opacity:0;transition:opacity .25s, transform .25s; pointer-events:none;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,0.25);
    max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  /* ===== MODAL ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,15,0.55);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);}
  .modal-card{background:#fff;border-radius:20px;padding:24px 22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  .modal-card .m-icon{width:52px;height:52px;border-radius:14px;background:var(--pass-bg);color:var(--pass);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .modal-card .m-icon svg{width:26px;height:26px;}
  .modal-card h3{font-size:17px;font-weight:800;margin:0 0 6px;}
  .modal-card p{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  .modal-card input{margin-bottom:14px;}

  .view-fade{animation:vf .22s ease;}
  @keyframes vf{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}
  .empty{text-align:center;color:var(--muted2);font-size:12.5px;padding:34px 10px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="hdr-row">
      <button class="back" id="backBtn" style="display:none;"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <img class="logo" src="icons/icon-192.png" alt="logo">
      <div class="titles">
        <div class="t1" id="hdrTitle">Site T&amp;C Data Capture</div>
        <div class="t2" id="hdrSub">Smart PV Solar</div>
      </div>
      <div class="sync-pill" id="syncPill" onclick="go('settings')"><span class="dot" id="syncDot"></span><span id="syncText">—</span></div>
    </div>
    <div class="site-strip" id="siteStrip" style="display:none;" onclick="go('settings')">
      <svg class="ic" viewBox="0 0 24 24" width="16" height="16"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
      <div class="name" id="siteStripName">—</div>
      <button onclick="event.stopPropagation(); go('settings')">Switch</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   ICONS
=============================================================*/
const ICONS = {
  wrench: '<polygon points="12,3 19,7 19,17 12,21 5,17 5,7"/><circle cx="12" cy="12" r="3"/>',
  bolt: '<polygon points="13,2 4,14 11,14 9,22 20,10 13,10" fill="currentColor" stroke="none"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="18" x2="9" y2="22"/><line x1="15" y1="18" x2="15" y2="22"/><line x1="2" y1="9" x2="6" y2="9"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="22" y2="9"/><line x1="18" y1="15" x2="22" y2="15"/>',
  coil: '<path d="M2 12h4l2-5 4 10 2-5h8"/>',
  tower: '<line x1="12" y1="2" x2="12" y2="22"/><line x1="6" y1="8" x2="18" y2="8"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>',
  sync: '<path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/>',
  bars: '<line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="7"/><line x1="19" y1="20" x2="19" y2="4"/>',
  alert: '<path d="M12 3 2 21h20z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none"/>',
  clipboard: '<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>',
  ground: '<line x1="12" y1="2" x2="12" y2="12"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/><line x1="10" y1="20" x2="14" y2="20"/>',
  shield: '<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z"/><polyline points="9,12 11,14 15,10"/>',
  flag: '<line x1="6" y1="2" x2="6" y2="22"/><path d="M6 3h13l-3 4 3 4H6"/>',
  gauge: '<circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="16" y2="9"/><line x1="8" y1="6" x2="9" y2="7.5"/>',

/* ============================================================
   INDEXEDDB LAYER (offline-first, per-device)
=============================================================*/
const DB_NAME = 'SmartPVSolarTC';
const DB_VERSION = 1;
const STORE = 'kv';
let dbFailed = false;
let memFallback = {};

function openDB(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no indexeddb')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  if(dbFailed) return memFallback[key];
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = ()=> resolve(r.result);
      r.onerror = ()=> reject(r.error);
    });
  }catch(e){ dbFailed = true; return memFallback[key]; }
}
async function idbDelete(key){
  if(dbFailed){ delete memFallback[key]; return true; }
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ dbFailed = true; delete memFallback[key]; return true; }
}
async function idbSet(key, val){
  if(dbFailed){ memFallback[key] = val; return true; }
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ dbFailed = true; memFallback[key] = val; return true; }
}

/* ============================================================
   STATE
=============================================================*/
const state = {};
let activeSite = null;
let knownSites = [];
let syncConfig = { url:'', secret:'' };
let syncLog = [];
let saveTimer = null;
let dirtyCount = 0;

function skey(id){ return 'data:' + activeSite + ':' + id; }

async function loadKey(key, fallback){
  const v = await idbGet(key);
  if(v === undefined || v === null) return fallback;
  try{ return JSON.parse(v); }catch(e){ return fallback; }
}
function queueSave(id){
  dirtyCount++;
  updateSyncPill();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await idbSet(skey(id), JSON.stringify(state[id]));
  }, 400);
}

async function loadSiteData(){
  for(const s of CHECKLIST_SECTIONS){
    state[s.id] = await loadKey(skey(s.id), s.items.map(()=>({status:null, remarks:''})));
  }
  state.strings = await loadKey(skey('strings'), buildDefaultStrings());
  state.earthing = await loadKey(skey('earthing'), {
    measures: Object.fromEntries(EARTH_POINTS.map(p=>[p.key,{value:'',result:null}])),
    checks: EARTH_CHECKS.map(()=>({status:null, remarks:''})),
  });
  state.protection = await loadKey(skey('protection'), Object.fromEntries(PROTECTION_ITEMS.map(p=>[p.key,{applied:'',result:null}])));
  state.punchlist = await loadKey(skey('punchlist'), DEFAULT_PUNCHLIST.map(t=>({text:t, status:'Open', remarks:''})));
  state.equipment = await loadKey(skey('equipment'), DEFAULT_EQUIPMENT.map(n=>({name:n, model:'', serial:'', cal:'', due:''})));
  state.signoff = await loadKey(skey('signoff'), {
    engineer:{name:'',designation:'',date:''},
    supervisor:{name:'',designation:'',date:''},
    mes:{name:'',designation:'',date:''},
  });
  dirtyCount = (await loadKey('meta:dirty:'+activeSite, 0)) || 0;
}

async function loadMeta(){
  knownSites = await loadKey('meta:sites', []);
  activeSite = await loadKey('meta:activeSite', null);
  syncConfig = await loadKey('meta:config', { url:'', secret:'', adminKey:'' });
  syncLog = await loadKey('meta:synclog', []);
}
async function saveMeta(){
  await idbSet('meta:sites', JSON.stringify(knownSites));
  await idbSet('meta:activeSite', JSON.stringify(activeSite));
}

function promptNewSite(isFirstRun){
  const body = `

    <h3>${isFirstRun ? 'Welcome — set up your site' : 'Add a new site'}</h3>
    <p>${isFirstRun ? 'Enter the project/site name. All checklists, string tests and readings you capture will be tagged to this site.' : 'Enter a name for the new site. Data already captured for other sites stays saved and can be switched back to anytime.'}</p>

async function confirmNewSite(isFirstRun){
  const inp = document.getElementById('newSiteInput');
  const name = (inp.value || '').trim();
  if(!name){ inp.focus(); return; }
  if(!knownSites.includes(name)) knownSites.push(name);
  activeSite = name;
  await saveMeta();
  closeModal();
  await loadSiteData();
  currentView = 'home';
  render();
}

    txt.textContent = 'Synced';
  }
}

function checklistProgress(id){ const arr = state[id]; return { done: arr.filter(x=>x.status).length, total: arr.length }; }

  const m = Object.values(state.earthing.measures).filter(x=>x.value!=='').length;

  html += homeCard('protection','shield','teal','Protection & Grid Code','6 protection functions', protectionProgress());

  html += `<div class="section-title">Site Records</div>`;

function homeCard(view, iconName, tint, name, sub, pr){
  let badge;
  if(pr){
    const cls = pr.done===0 ? 'zero' : (pr.done===pr.total ? 'done' : '');
    badge = `<div class="badge ${cls}">${pr.done}/${pr.total}</div>`;
  } else {
    badge = `<div class="badge arrow">${icon('arrowRight',14)}</div>`;
  }
  return `<div class="home-card" data-view="${view}">
    <div class="ic-wrap tint-${tint}">${icon(iconName)}</div>
    <div class="info"><div class="name">${name}</div><div class="sub">${sub}</div></div>
    ${badge}
  </div>`;
}

async function deleteSite(name){
  if(!confirm('Delete "' + name + '" from this phone' + (syncConfig.url && syncConfig.secret ? ' and from the Google Sheet' : '') + '? This cannot be undone.')) return;
  if(!confirm('Are you absolutely sure? All local data for this site will be erased.')) return;

  let remoteOk = null;
  if(syncConfig.url && syncConfig.secret){
    try{
      const resp = await fetch(syncConfig.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ secret: syncConfig.secret, site: name, action: 'delete' }),
      });
      const text = await resp.text();
      let json = null;
      try{ json = JSON.parse(text); }catch(e){}
      remoteOk = !!(resp.ok && json && json.ok);
    }catch(e){ remoteOk = false; }
  }

  // remove local data keys for this site
  const idsToClear = [...CHECKLIST_SECTIONS.map(s=>s.id), 'strings','earthing','protection','punchlist','equipment','signoff'];
  for(const id of idsToClear){ await idbDelete('data:'+name+':'+id); }
  await idbDelete('meta:dirty:'+name);

  knownSites = knownSites.filter(s=>s!==name);
  if(activeSite === name){
    activeSite = knownSites.length ? knownSites[0] : null;
  }
  await saveMeta();

  if(remoteOk === true) toast('Site deleted (removed from Google Sheet too)');
  else if(remoteOk === false) toast('Deleted locally — could not reach Google Sheet, remove rows manually');
  else toast('Site deleted from this phone');

  if(activeSite){ await loadSiteData(); go('settings'); }
  else { promptNewSite(true); }
}

      measures: Object.fromEntries(EARTH_POINTS.map(p=>[p.label, state.earthing.measures[p.key]])),
      checks: EARTH_CHECKS.map((label,i)=>({item:label, ...state.earthing.checks[i]})),
    },
    protection: Object.fromEntries(PROTECTION_ITEMS.map(p=>[p.label, state.protection[p.key]])),
    punchlist: state.punchlist,
    equipment: state.equipment,
    signoff: state.signoff,
  };
}
function renderExport(){
  setHeader('Export / Sync Now', activeSite, true);

  const hasConfig = syncConfig.url && syncConfig.secret;
  let html = `

  document.getElementById('copyBtn').addEventListener('click', async ()=>{

  });

  if(hasConfig){
    document.getElementById('syncNowBtn').addEventListener('click', syncNow);
  }

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('This will erase all data captured for "' + activeSite + '" on this device. Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    for(const s of CHECKLIST_SECTIONS){ state[s.id] = s.items.map(()=>({status:null, remarks:''})); await idbSet(skey(s.id), JSON.stringify(state[s.id])); }
    state.strings = buildDefaultStrings(); await idbSet(skey('strings'), JSON.stringify(state.strings));
    state.earthing = { measures: Object.fromEntries(EARTH_POINTS.map(p=>[p.key,{value:'',result:null}])), checks: EARTH_CHECKS.map(()=>({status:null, remarks:''})) };
    await idbSet(skey('earthing'), JSON.stringify(state.earthing));
    state.protection = Object.fromEntries(PROTECTION_ITEMS.map(p=>[p.key,{applied:'',result:null}]));
    await idbSet(skey('protection'), JSON.stringify(state.protection));
    state.punchlist = DEFAULT_PUNCHLIST.map(t=>({text:t, status:'Open', remarks:''}));
    await idbSet(skey('punchlist'), JSON.stringify(state.punchlist));
    state.equipment = DEFAULT_EQUIPMENT.map(n=>({name:n, model:'', serial:'', cal:'', due:''}));
    await idbSet(skey('equipment'), JSON.stringify(state.equipment));
    state.signoff = { engineer:{name:'',designation:'',date:''}, supervisor:{name:'',designation:'',date:''}, mes:{name:'',designation:'',date:''} };
    await idbSet(skey('signoff'), JSON.stringify(state.signoff));
    dirtyCount = 0; await idbSet('meta:dirty:'+activeSite, JSON.stringify(0));
    toast('Site data reset');
    go('home');
  });
}

async function syncNow(){
  const btn = document.getElementById('syncNowBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = 'Syncing…'; btn.style.pointerEvents = 'none';
  const payload = buildPayload();
  let ok = false, errMsg = '';
  try{
    const resp = await fetch(syncConfig.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ secret: syncConfig.secret, site: activeSite, payload }),
    });
    const text = await resp.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(resp.ok && json && json.ok){ ok = true; }
    else { errMsg = (json && json.error) || ('HTTP ' + resp.status); }
  }catch(e){ errMsg = e.message || 'Network error'; }

  const entry = { time: new Date().toLocaleString(), ok, err: errMsg };
  syncLog.unshift(entry);
  syncLog = syncLog.slice(0,20);
  await idbSet('meta:synclog', JSON.stringify(syncLog));

  if(ok){
    dirtyCount = 0;
    await idbSet('meta:dirty:'+activeSite, JSON.stringify(0));
    toast('Synced to Google Sheet ✓');
  } else {
    toast('Sync failed: ' + (errMsg || 'unknown error'));
  }
  updateSyncPill();
  btn.innerHTML = originalHtml; btn.style.pointerEvents = '';
}

  const strFail = strs.filter(s=>s.result==='fail');
  html += `<div class="section-title">String Test Log</div><div class="item">
    <div class="ro-row"><div class="lbl">Total strings tested</div><div class="ro-chip na">${strs.filter(s=>s.result).length}/${strs.length}</div></div>
    <div class="ro-row"><div class="lbl">Failed strings</div><div class="ro-chip ${strFail.length?'fail':'pass'}">${strFail.length}</div></div>
    ${strFail.map(s=>`<div class="ro-row"><div class="lbl">${s.id} (${s.inverter})</div>${chipFor(s.result)}</div>`).join('')}
  </div>`;

  html += `<div class="section-title">Earthing</div><div class="item">`;
  (d.earthing && d.earthing.measures || []).forEach(m=>{
    html += `<div class="ro-row"><div class="lbl">${m.point}</div><div class="ro-chip na">${m.value||'—'} Ω</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Punch List</div><div class="item">`;
  const open = (d.punchlist||[]).filter(p=>p.status==='Open');
  if(!open.length) html += `<div class="ro-row"><div class="lbl">No open items</div><span class="ro-chip pass">Clear</span></div>`;
  open.forEach(p=> html += `<div class="ro-row"><div class="lbl">${p.item}</div><span class="ro-chip fail">Open</span></div>`);
  html += `</div>`;

  html += `<div class="section-title">Sign-Off</div><div class="item">`;
  (d.signoff||[]).forEach(s=>{
    html += `<div class="ro-row"><div class="lbl">${s.role}${s.name?' — '+s.name:''}</div>${s.name && s.date ? '<span class="ro-chip pass">Signed</span>' : '<span class="ro-chip pending">Pending</span>'}</div>`;
  });
  html += `</div>`;

  document.getElementById('main').innerHTML = `<div class="view-fade">${html}</div>`;
}

/* ============================================================
   ROUTER
=============================================================*/
function render(){
  if(currentView==='home') renderHome();
  else if(CHECKLIST_SECTIONS.find(s=>s.id===currentView)) renderChecklist(currentView);
  else if(currentView==='strings') renderStrings();
  else if(currentView==='earthing') renderEarthing();
  else if(currentView==='protection') renderProtection();
  else if(currentView==='punchlist') renderPunchlist();
  else if(currentView==='equipment') renderEquipment();
  else if(currentView==='signoff') renderSignoff();
  else if(currentView==='settings') renderSettings();
  else if(currentView==='export') renderExport();
  else if(currentView==='manager') renderManager();
  else if(currentView==='managerDetail') renderManagerDetail();
}

/* ============================================================
   INIT
=============================================================*/
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}

(async function init(){
  await loadMeta();
  if(!activeSite || !knownSites.length){
    promptNewSite(true);
    return;
  }
  await loadSiteData();
  render();
})();
</script>
</body>
</html>
